<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Done!</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I'm Done!">
<meta name="theme-color" content="#0c0c10">
<meta name="description" content="나만의 스케줄러 — 할 일, 프로젝트, 루틴 관리">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22I'm%20Done!%22%2C%22short_name%22%3A%22I'm%20Done%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230c0c10%22%2C%22theme_color%22%3A%22%230c0c10%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%3D'0%25200%252064%252064'%253E%253Crect%2520width%3D'64'%2520height%3D'64'%2520rx%3D'12'%2520fill%3D'%25230c0c10'%2F%253E%253Ctext%2520x%3D'32'%2520y%3D'44'%2520text-anchor%3D'middle'%2520font-size%3D'36'%2520fill%3D'%25234ecdc4'%253E%25E2%259C%2593%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
@font-face{font-family:'Hangang';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/Hangang.woff2') format('woff2');font-weight:normal;font-style:normal;}
:root{
  --bg:#0c0c10;--surface:#13131a;--surface2:#1c1c26;--surface3:#252532;
  --border:#28283a;--border2:#36364e;
  --text:#ebebf5;--text2:#8888aa;--text3:#52526a;
  --accent:#6c63ff;--accent2:#a89cff;
  --today-bg:#19172e;--today-border:#6c63ff;
  --cat-church:#ff8fab;--cat-family:#ffd166;--cat-personal:#6bcb77;--cat-other:#74b9ff;
  --pri-urgent:#ff6b6b;--pri-normal:#f0b155;--pri-someday:#5bbf7e;--pri-routine:#74b9ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hangang','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;}
.logo{font-family:'Space Mono',monospace;font-size:1.15rem;font-weight:700;letter-spacing:-.02em;color:#4ecdc4;}
.logo .white{color:var(--text);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s;}
.sync-dot.online{background:#4ecdc4;}
.sync-dot.saving{background:var(--pri-normal);animation:pulse .6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s;}
.sync-dot.online{background:#4ecdc4;}
.sync-dot.saving{background:var(--pri-normal);animation:pulse .6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-right{display:flex;align-items:center;gap:8px;}
.view-toggle{display:flex;background:var(--surface2);border-radius:7px;padding:3px;border:1px solid var(--border);}
.view-btn{padding:4px 12px;border:none;background:none;color:var(--text2);cursor:pointer;border-radius:5px;font-size:.72rem;font-family:'Space Mono',monospace;transition:all .2s;}
.view-btn.active{background:var(--accent);color:#fff;}
.btn{padding:6px 13px;border-radius:7px;border:none;cursor:pointer;font-family:'Hangang',sans-serif;font-size:.78rem;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}

/* LAYOUT */
.main{display:flex;height:calc(100vh - 51px);}

/* ── SIDEBAR: narrower ── */
aside{width:190px;min-width:190px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-scroll{flex:1;overflow-y:auto;overflow-x:hidden;}
.sidebar-scroll::-webkit-scrollbar{width:3px;}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* sidebar top label */
.sidebar-top-label{padding:12px 12px 4px;font-size:.6rem;font-family:'Space Mono',monospace;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;}

/* CATEGORY SECTION (inside "오늘 할 일") */
.cat-section{border-bottom:none;}
.cat-section-header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 5px;cursor:pointer;user-select:none;}
.cat-section-header:hover{background:var(--surface2);}
.cat-section-label{display:flex;align-items:center;gap:6px;font-size:.6rem;font-family:'Space Mono',monospace;letter-spacing:.09em;text-transform:uppercase;font-weight:700;}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cat-chevron{font-size:.55rem;color:var(--text3);transition:transform .2s;}
.cat-section.collapsed .cat-chevron{transform:rotate(-90deg);}
.cat-section-body{padding:0 8px 6px;}
.cat-section.collapsed .cat-section-body{display:none;}
.task-list{display:flex;flex-direction:column;gap:3px;}

/* divider between "오늘할일" and "프로젝트" */
.sidebar-divider{height:1px;background:var(--border);margin:4px 0;}

/* PROJECT SECTION */
.proj-section{padding:0 0 8px;}
.proj-section-header{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 5px;cursor:pointer;user-select:none;}
.proj-section-header:hover{background:var(--surface2);}
.proj-section-label{font-size:.6rem;font-family:'Space Mono',monospace;letter-spacing:.09em;color:var(--text3);text-transform:uppercase;}
.proj-section.collapsed .proj-body{display:none;}
.proj-section.collapsed .proj-chevron{transform:rotate(-90deg);}
.proj-chevron{font-size:.55rem;color:var(--text3);transition:transform .2s;}
.proj-body{padding:0 8px 4px;}

/* TASK ITEM */
.task-item{display:flex;align-items:flex-start;gap:5px;padding:6px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);transition:border-color .15s,background .15s,transform .12s,box-shadow .12s;position:relative;user-select:none;cursor:default;}
.task-item:hover{border-color:var(--border2);}
.task-item.reorder-active{border-color:var(--accent)!important;background:var(--surface3)!important;box-shadow:0 4px 16px rgba(108,99,255,.3);transform:scale(1.02);z-index:10;}
.task-item.reorder-target{border-color:var(--accent2)!important;border-style:dashed!important;}
.task-check{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;cursor:pointer;transition:all .15s;}
.task-check.done{background:var(--accent);border-color:var(--accent);}
.task-check.done::after{content:'✓';font-size:.5rem;color:#fff;}
.task-body{flex:1;min-width:0;}
.task-text{font-size:.72rem;line-height:1.35;}
.task-text.done{text-decoration:line-through;color:var(--text3);}
.task-meta{font-size:.6rem;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pri-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.routine-tag{font-size:.5rem;padding:1px 3px;border-radius:6px;background:rgba(116,185,255,.18);color:var(--pri-routine);font-family:'Space Mono',monospace;margin-left:2px;}
.cat-tag{font-size:.5rem;padding:1px 4px;border-radius:6px;font-family:'Space Mono',monospace;margin-left:3px;font-weight:600;}
.empty{text-align:center;padding:8px 0;color:var(--text3);font-size:.68rem;}
.handle{font-size:.68rem;color:var(--text3);cursor:grab;flex-shrink:0;margin-top:2px;padding:0 1px;opacity:0;transition:opacity .15s;touch-action:none;}
.task-item:hover .handle{opacity:1;}
.handle:active{cursor:grabbing;}
.item-menu-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:1px 3px;border-radius:3px;font-size:.85rem;line-height:1;flex-shrink:0;opacity:0;transition:all .15s;}
.task-item:hover .item-menu-btn{opacity:1;}
.item-menu-btn:hover{color:var(--text2);background:var(--surface3);}

/* CONTEXT MENU */
.context-menu{position:fixed;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:5px;z-index:900;min-width:120px;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:menuIn .12s ease;}
@keyframes menuIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.76rem;color:var(--text2);transition:all .12s;}
.ctx-item:hover{background:var(--surface3);color:var(--text);}
.ctx-item.danger{color:var(--pri-urgent);}
.ctx-item.danger:hover{background:rgba(255,107,107,.1);}

/* ── CALENDAR: wider, taller cells ── */
.cal-area{flex:1;overflow-y:auto;padding:16px 18px;}
.cal-area::-webkit-scrollbar{width:5px;}
.cal-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month-title{font-family:'Hangang','Apple SD Gothic Neo',sans-serif;font-size:1.7rem;font-weight:700;display:flex;align-items:baseline;gap:9px;}
.cal-month-title .year{font-size:.85rem;font-family:'Space Mono',monospace;color:var(--text3);font-weight:400;}
.nav-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface2);}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.day-header{text-align:center;padding:5px 2px;font-size:.62rem;font-family:'Space Mono',monospace;letter-spacing:.04em;color:var(--text3);text-transform:uppercase;}

/* Taller cells so text fits */
.cal-wrapper{}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.proj-lane-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:1px;}
.proj-lane-seg{
  height:4px;border-radius:2px;
  opacity:.85;
  position:relative;
}
.proj-lane-seg.seg-start{border-radius:4px 2px 2px 4px;}
.proj-lane-seg.seg-end{border-radius:2px 4px 4px 2px;}
.proj-lane-seg.seg-alone{border-radius:4px;}
.proj-lane-seg.seg-mid{border-radius:0;}
.proj-lane-seg.seg-empty{background:transparent!important;pointer-events:none;}
.proj-lane-seg .seg-label{
  position:absolute;top:-14px;left:4px;
  font-size:.58rem;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:90px;line-height:1.2;
}

.day-cell{
  min-height:90px;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:5px 5px 3px;cursor:pointer;
  transition:border-color .15s,background .15s;overflow:hidden;
}
.day-cell:hover{border-color:var(--border2);background:var(--surface2);}
.day-cell.today{background:var(--today-bg);border-color:var(--today-border);}
.day-cell.other-month{opacity:.25;}
.day-cell.selected{border-color:var(--accent2);}
.day-num{font-size:.72rem;font-weight:600;color:var(--text2);margin-bottom:3px;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;}
.day-cell.today .day-num{background:var(--accent);color:#fff;}
.day-tasks{display:flex;flex-direction:column;gap:2px;margin-top:2px;}

/* ── CHIP: text label, no icon ── */
.day-task-chip{
  font-size:.65rem;padding:2px 5px;border-radius:3px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:500;line-height:1.3;
}
.more-count{font-size:.58rem;color:var(--text3);font-family:'Space Mono',monospace;margin-top:2px;}

/* short bar + label for tasks/routines */
.day-item-row{display:flex;align-items:center;gap:4px;margin-bottom:1px;}
.day-item-bar{width:3px;height:12px;border-radius:2px;flex-shrink:0;}
.day-item-label{font-size:.63rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}

/* project continuing bar (thin horizontal) */
.proj-cont-bar{height:3px;border-radius:2px;margin:2px 0;opacity:.8;}

/* project bars inside cell */
.proj-in-cell{display:flex;flex-direction:column;gap:1px;margin:2px 0 3px;}

/* YEAR */
.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
.year-month-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;transition:all .2s;}
.year-month-card:hover{border-color:var(--accent2);transform:translateY(-2px);}
.year-month-card.current-month{border-color:var(--accent);}
.year-month-name{font-family:'Hangang','Apple SD Gothic Neo',sans-serif;font-size:.9rem;margin-bottom:6px;font-weight:700;}
.year-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.ymg-head{font-size:.45rem;text-align:center;color:var(--text3);padding:1px 0;}
.ymg-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.5rem;color:var(--text3);border-radius:3px;position:relative;}
.ymg-day.today{background:var(--accent);color:#fff;border-radius:50%;}
.ymg-day.has-ev::after{content:'';position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:var(--accent2);}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:15px;padding:22px;width:440px;max-width:95vw;max-height:88vh;overflow-y:auto;transform:translateY(14px);transition:transform .2s;box-shadow:0 28px 80px rgba(0,0,0,.65);}
.overlay.open .modal{transform:translateY(0);}
.modal-title{font-family:'Hangang','Apple SD Gothic Neo',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:15px;}
.form-group{margin-bottom:12px;}
.form-label{font-size:.62rem;font-family:'Space Mono',monospace;letter-spacing:.09em;color:var(--text3);text-transform:uppercase;margin-bottom:5px;display:block;}
.form-input{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Hangang',sans-serif;font-size:.83rem;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--accent2);}
.form-select{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Hangang',sans-serif;font-size:.83rem;outline:none;appearance:none;cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;}
.tag-chip{padding:4px 11px;border-radius:18px;font-size:.68rem;cursor:pointer;border:2px solid transparent;transition:all .15s;font-weight:600;}
.tag-chip.selected{border-color:rgba(255,255,255,.5);}

/* DAY POPUP */
.day-popup{background:var(--surface);border:1px solid var(--border2);border-radius:13px;padding:18px;width:340px;max-width:95vw;max-height:80vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.popup-date{font-family:'Hangang','Apple SD Gothic Neo',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:12px;}
.popup-section-title{font-size:.58rem;font-family:'Space Mono',monospace;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin:10px 0 5px;}
.popup-task-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;background:var(--surface2);margin-bottom:3px;}
.popup-task-label{font-size:.77rem;flex:1;cursor:pointer;}
.popup-task-label.done{text-decoration:line-through;color:var(--text3);}
.cat-badge{font-size:.55rem;padding:2px 5px;border-radius:18px;font-weight:600;font-family:'Space Mono',monospace;white-space:nowrap;}
.popup-action-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.68rem;padding:2px 4px;border-radius:3px;transition:all .12s;flex-shrink:0;}
.popup-action-btn:hover{color:var(--text2);background:var(--surface3);}
.popup-action-btn.danger:hover{color:var(--pri-urgent);background:rgba(255,107,107,.12);}
.add-quick{display:flex;gap:6px;margin-top:10px;}
.add-quick input{flex:1;padding:6px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Hangang',sans-serif;font-size:.76rem;outline:none;}
.add-quick input:focus{border-color:var(--accent2);}
.add-quick-btn{padding:6px 12px;background:var(--accent);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:.76rem;font-weight:700;}
.add-quick-btn:hover{background:var(--accent2);}

/* cat colors */
.cat-church{background:var(--cat-church);}
.cat-family{background:var(--cat-family);}
.cat-personal{background:var(--cat-personal);}
.cat-other{background:var(--cat-other);}
.cat-church-bg{background:rgba(255,143,171,.18);color:var(--cat-church);}
.cat-family-bg{background:rgba(255,209,102,.18);color:var(--cat-family);}
.cat-personal-bg{background:rgba(107,203,119,.18);color:var(--cat-personal);}
.cat-other-bg{background:rgba(116,185,255,.18);color:var(--cat-other);}

.modal::-webkit-scrollbar,.day-popup::-webkit-scrollbar{width:3px;}
.modal::-webkit-scrollbar-thumb,.day-popup::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@media(max-width:580px){
  .year-grid{grid-template-columns:repeat(2,1fr);}
  aside{
    position:fixed;top:0;left:0;height:100vh;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:300;
    box-shadow:4px 0 24px rgba(0,0,0,.5);
  }
  aside.open{transform:translateX(0);}
  .sidebar-backdrop{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    z-index:299;
  }
  .sidebar-backdrop.open{display:block;}
  .swipe-hint{
    position:fixed;left:0;top:50%;transform:translateY(-50%);
    width:6px;height:60px;
    background:var(--accent);
    border-radius:0 4px 4px 0;
    opacity:.5;z-index:200;
    pointer-events:none;
  }
}
</style>
</head>
<body>

<header>
  <div class="logo" style="display:flex;align-items:center;gap:8px">
    <span><span class="white">I'm </span>Done!</span>
    <div class="sync-dot" id="sync-dot" title="연결 상태"></div>
  </div>
  <div class="header-right">
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('month')" id="vbtn-month">월별</button>
      <button class="view-btn" onclick="setView('year')" id="vbtn-year">연간</button>
    </div>
    <button class="btn btn-ghost" onclick="goToday()">오늘</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ 추가</button>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
<div class="swipe-hint" id="swipe-hint"></div>
<div class="main">
  <aside>
    <div class="sidebar-scroll" id="sidebar-scroll"></div>
  </aside>
  <div class="cal-area" id="cal-area"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="add-overlay" onclick="closeOverlay(event,'add-overlay')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">새 일정</div>
    <div class="form-group">
      <label class="form-label">제목</label>
      <input class="form-input" id="f-title" placeholder="일정 제목을 입력하세요"/>
    </div>
    <div class="form-group">
      <label class="form-label">종류</label>
      <div class="tag-row">
        <span class="tag-chip cat-personal selected" id="type-task"    onclick="selectType('task')">📌 할 일</span>
        <span class="tag-chip cat-church"            id="type-project" onclick="selectType('project')">🚀 프로젝트</span>

<script>
/* ══════════════ DATA ══════════════ */
const STORE_KEY='imdone_v1';
let events=[];
let currentYear,currentMonth;

let editingId=null;

const collapsed={proj:false};

const today=new Date();today.setHours(0,0,0,0);
const todayStr=()=>fmtDate(today);
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function parseDate(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}

// ── Firebase 초기화 ──

function load(){
  eventsRef.on('value',snap=>{

function save(){

  renderAll();

  events.forEach(e=>{obj[e.id]=e;});
  eventsRef.set(obj).then(()=>setSyncDot('online')).catch(()=>{setSyncDot('');isLocalUpdate=false;});
}


const CAT_COLORS={church:'var(--cat-church)',family:'var(--cat-family)',personal:'var(--cat-personal)',other:'var(--cat-other)'};
const CAT_BG={church:'cat-church-bg',family:'cat-family-bg',personal:'cat-personal-bg',other:'cat-other-bg'};
const CAT_LABEL={church:'교회',family:'가족',personal:'개인',other:'기타'};
const CAT_HEX={church:'#ff8fab',family:'#ffd166',personal:'#6bcb77',other:'#74b9ff'};
const PRI_COLOR={urgent:'var(--pri-urgent)',normal:'var(--pri-normal)',someday:'var(--pri-someday)',routine:'var(--pri-routine)'};
const CATS=['church','family','personal','other'];

function catColor(c){return CAT_COLORS[c]||CAT_COLORS.other;}
function catBgCls(c){return CAT_BG[c]||CAT_BG.other;}
function catLabel(c){return CAT_LABEL[c]||'기타';}
function priColor(p){return PRI_COLOR[p]||PRI_COLOR.normal;}

function eventsOnDate(ds){
  const res=[];
  events.forEach(e=>{
    if(e.type==='routine'){
      if(ds < e.date) return; // 시작일 이전 — 표시 안 함
      if(e.endDate && ds >= e.endDate) return; // 삭제일 이후 — 표시 안 함
      // 시작일 이후 & 삭제일 이전(또는 삭제 안 함) — 항상 표시
      res.push({...e, done:!!(e.dailyDone&&e.dailyDone[ds]), _rDay:ds});
    }
    else if(e.type==='task'){if(e.date===ds)res.push(e);}
    else if(e.type==='project'){if(ds>=e.date&&ds<=(e.date2||e.date))res.push(e);}
  });
  return res;
}

/* ══════════════ INIT ══════════════ */
function init(){
  load();
  const n=new Date();currentYear=n.getFullYear();currentMonth=n.getMonth();
  document.addEventListener('click',e=>{
    const m=document.getElementById('ctx-menu');
    if(m.style.display!=='none'&&!m.contains(e.target))hideCtxMenu();
  });
  renderAll();
}
function renderAll(){renderSidebar();if(view==='month')renderMonth();else renderYear();}

/* ══════════════ SIDEBAR ══════════════ */
function renderSidebar(){
  const tds=todayStr();
  const scroll=document.getElementById('sidebar-scroll');
  scroll.innerHTML='';

  /* ── 오늘 할 일 (우선순위 순, 카테고리 뱃지) ── */
  const todayLabel=document.createElement('div');
  todayLabel.className='sidebar-top-label';
  todayLabel.textContent='오늘 할 일';
  scroll.appendChild(todayLabel);

  // 우선순위 순서
  const PRI_ORDER={urgent:0,normal:1,someday:2,routine:3};

  // 모든 오늘 할 일 + 루틴 수집
  let allToday=[];
  events.filter(e=>e.type==='task'&&e.date===tds).forEach(e=>allToday.push(e));
  events.filter(e=>e.type==='routine'&&(!e.endDate||e.endDate>tds)).forEach(e=>{
    const isDone=!!(e.dailyDone&&e.dailyDone[tds]);
    allToday.push({...e,done:isDone,_isRoutine:true});
  });

  // 우선순위 순 정렬
  allToday.sort((a,b)=>(PRI_ORDER[a.priority]??1)-(PRI_ORDER[b.priority]??1));

  const todayListWrap=document.createElement('div');
  todayListWrap.style.padding='0 8px 10px';
  const todayList=document.createElement('div');
  todayList.className='task-list';
  todayList.id='today-list-inner';

  if(!allToday.length){
    const emp=document.createElement('div');
    emp.className='empty';emp.textContent='오늘 할 일 없음';
    todayList.appendChild(emp);
  } else {
    allToday.forEach(item=>todayList.appendChild(makeSidebarRow(item,tds)));
  }
  todayListWrap.appendChild(todayList);
  scroll.appendChild(todayListWrap);

  /* ── 프로젝트 섹션 ── */
  const div=document.createElement('div');div.className='sidebar-divider';scroll.appendChild(div);

  const activeProjs=events.filter(e=>e.type==='project'&&!e.done&&(!e.date2||e.date2>=todayStr()));
  const projSec=document.createElement('div');
  projSec.className='proj-section'+(collapsed.proj?' collapsed':'');
  projSec.innerHTML=`
    <div class="proj-section-header" onclick="toggleCat('proj')">
      <span class="proj-section-label">프로젝트 진행 중 <span style="color:var(--text3)">${activeProjs.length}</span></span>
      <span class="proj-chevron">▾</span>
    </div>
    <div class="proj-body"><div class="task-list" id="proj-list"></div></div>`;
  scroll.appendChild(projSec);

  const pl=projSec.querySelector('#proj-list');
  if(!activeProjs.length){
    const emp=document.createElement('div');emp.className='empty';emp.textContent='없음';pl.appendChild(emp);
  } else {
    activeProjs.forEach(e=>{
      const end=parseDate(e.date2);
      const diff=end?Math.ceil((end-today)/86400000):null;
      const dLabel=diff!==null?(diff>0?`D-${diff}`:diff===0?'D-Day':'마감됨'):'';
      const endLabel=e.date2?`~ ${e.date2.slice(5).replace('-','/')}`:'';
      const row=makeSidebarRow(e,null);
      // 날짜 정보 행 추가
      const taskBody=row.querySelector('.task-body');
      if(taskBody){
        const dateLine=document.createElement('div');
        dateLine.style.cssText='display:flex;align-items:center;gap:5px;margin-top:2px;';
        dateLine.innerHTML=`
          <span style="font-size:.6rem;color:var(--text3);font-family:'Space Mono',monospace">${endLabel}</span>
          ${dLabel?`<span style="font-size:.58rem;padding:1px 5px;border-radius:5px;font-family:'Space Mono',monospace;font-weight:600;background:${diff<=0?'rgba(255,107,107,.15)':diff<=3?'rgba(240,177,85,.15)':'rgba(91,191,126,.15)'};color:${diff<=0?'var(--pri-urgent)':diff<=3?'var(--pri-normal)':'var(--pri-someday)'}">${dLabel}</span>`:''}
        `;
        taskBody.appendChild(dateLine);
      }
      pl.appendChild(row);
    });
  }
}

function toggleCat(key){collapsed[key]=!collapsed[key];renderSidebar();}

/* ══════════════ SIDEBAR ROW + REORDER ══════════════ */
let reorderSrcEl=null,reorderSrcId=null,longPressTimer=null,reorderMode=false;

function makeSidebarRow(item,tds){
  const row=document.createElement('div');
  row.className='task-item';
  row.dataset.id=item.id;
  const isDone=!!item.done;
  const catBadge=`<span class="cat-tag" style="background:${CAT_HEX[item.cat]}22;color:${CAT_HEX[item.cat]}">${CAT_LABEL[item.cat]}</span>`;
  const routineBadge=item._isRoutine?'<span class="routine-tag">루틴</span>':'';
  row.innerHTML=`
    <div class="handle" title="꾹 눌러 순서 변경">⠿</div>
    <div class="pri-dot" style="background:${priColor(item.priority)};margin-top:5px"></div>
    <div class="task-check ${isDone?'done':''}"></div>
    <div class="task-body">
      <div class="task-text ${isDone?'done':''}">${item.title}${routineBadge}${catBadge}</div>
    </div>
    <button class="item-menu-btn" title="옵션">⋯</button>`;

  row.querySelector('.task-check').addEventListener('click',ev=>{
    ev.stopPropagation();
    if(item._isRoutine)toggleRoutineDay(item.id,tds||todayStr());
    else toggleDone(item.id);
  });
  row.querySelector('.item-menu-btn').addEventListener('click',ev=>{ev.stopPropagation();showCtxMenu(ev,item.id,null);});

  const handle=row.querySelector('.handle');
  handle.addEventListener('mousedown',e=>{e.preventDefault();startLP(e,row,item.id);});
  handle.addEventListener('touchstart',e=>{e.preventDefault();startLP(e.touches[0],row,item.id);},{passive:false});
  ['mouseup','touchend','mouseleave'].forEach(ev=>handle.addEventListener(ev,cancelLP));
  return row;
}

function startLP(e,row,id){
  cancelLP();
  longPressTimer=setTimeout(()=>beginReorder(row,id),300);
}
function cancelLP(){
  if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
}
function beginReorder(row,id){
  reorderMode=true;reorderSrcEl=row;reorderSrcId=id;
  row.classList.add('reorder-active');
  document.querySelectorAll('.task-item').forEach(r=>{
    if(r!==row){r.classList.add('reorder-target');r.addEventListener('click',onDrop,{once:true});}
  });
  setTimeout(()=>document.addEventListener('click',cancelReorder,{once:true}),50);
}
function onDrop(e){
  e.stopPropagation();
  if(!reorderMode||!reorderSrcId)return;
  const dstId=e.currentTarget.dataset.id;
  if(dstId===reorderSrcId){endReorder();return;}
  const si=events.findIndex(x=>x.id===reorderSrcId),di=events.findIndex(x=>x.id===dstId);
  if(si>=0&&di>=0){const[m]=events.splice(si,1);events.splice(di,0,m);save();}
  endReorder();renderAll();
}
function cancelReorder(){endReorder();}
function endReorder(){
  reorderMode=false;
  if(reorderSrcEl)reorderSrcEl.classList.remove('reorder-active');
  document.querySelectorAll('.reorder-target').forEach(r=>{r.classList.remove('reorder-target');r.removeEventListener('click',onDrop);});
  reorderSrcEl=null;reorderSrcId=null;
  document.removeEventListener('click',cancelReorder);
}

/* ══════════════ CONTEXT MENU ══════════════ */
function showCtxMenu(e,id,ds){
  e.preventDefault();e.stopPropagation();
  ctxTargetId=id;ctxTargetDs=ds||null;
  const menu=document.getElementById('ctx-menu');
  menu.style.display='block';
  menu.style.left=Math.min(e.clientX,window.innerWidth-140)+'px';
  menu.style.top=Math.min(e.clientY,window.innerHeight-80)+'px';
}
function hideCtxMenu(){document.getElementById('ctx-menu').style.display='none';ctxTargetId=null;ctxTargetDs=null;}
function ctxEdit(){if(ctxTargetId)openEditModal(ctxTargetId);hideCtxMenu();}
function ctxDelete(){
  if(ctxTargetId){
    const e=events.find(x=>x.id===ctxTargetId);
    // ctxTargetDs 있으면 그 날짜 기준, 없으면 오늘 기준
    const cutDate=ctxTargetDs||todayStr();
    if(e&&e.type==='routine'){
      e.endDate=cutDate;
    } else if(e&&e.type==='project'){
      if(e.date>=cutDate) events=events.filter(x=>x.id!==ctxTargetId);
      else e.date2=cutDate;
    } else {
      events=events.filter(x=>x.id!==ctxTargetId);
    }
    save();if(ctxTargetDs)renderPopup(ctxTargetDs);renderAll();
  }
  hideCtxMenu();
}

/* ══════════════ MONTH VIEW ══════════════ */
function renderMonth(){
  const area=document.getElementById('cal-area');
  const MO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  const first=new Date(currentYear,currentMonth,1).getDay();
  const days=new Date(currentYear,currentMonth+1,0).getDate();
  const prevDays=new Date(currentYear,currentMonth,0).getDate();

  // build full grid
  const grid=[];
  for(let i=0;i<first;i++){
    const d=prevDays-first+1+i;
    const m=currentMonth===0?12:currentMonth;
    const y=currentMonth===0?currentYear-1:currentYear;
    grid.push({ds:y+'-'+pad(m)+'-'+pad(d),d,other:true});
  }
  for(let d=1;d<=days;d++) grid.push({ds:currentYear+'-'+pad(currentMonth+1)+'-'+pad(d),d,other:false});
  const total=first+days,rows=Math.ceil(total/7)*7;
  for(let i=1;i<=rows-total;i++){
    const m=currentMonth===11?1:currentMonth+2;
    const y=currentMonth===11?currentYear+1:currentYear;
    grid.push({ds:y+'-'+pad(m)+'-'+pad(i),d:i,other:true});
  }

  // collect active projects visible this month
  const monthStart=grid[0].ds, monthEnd=grid[grid.length-1].ds;
  const visibleProjs=events.filter(e=>
    e.type==='project'&&!e.done&&
    e.date<=monthEnd&&(e.date2||e.date)>=monthStart
  );

  // render week by week
  const numWeeks=grid.length/7;
  let html=`
    <div class="cal-header">
      <button class="nav-btn" onclick="prevMonth()">‹</button>
      <div class="cal-month-title">${MO[currentMonth]}<span class="year">${currentYear}</span></div>
      <button class="nav-btn" onclick="nextMonth()">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;">
      ${'일월화수목금토'.split('').map(d=>`<div class="day-header">${d}</div>`).join('')}
    </div>
    <div class="cal-wrapper">`;

  for(let w=0;w<numWeeks;w++){
    const weekCells=grid.slice(w*7,(w+1)*7);
    let cellsHtml='';

    weekCells.forEach(({ds,d,other},ci)=>{
      const dd=parseDate(ds);
      const isToday=dd&&dd.getTime()===today.getTime();
      let cls='day-cell';
      if(isToday) cls+=' today';
      if(other) cls+=' other-month';
      if(selectedDate===ds) cls+=' selected';

      // 1) 프로젝트 (시작날: 짧은 바+텍스트, 이어지는날: 얇은 바만)
      let projHtml='';
      const dayProjs=visibleProjs.filter(p=>ds>=p.date&&ds<=(p.date2||p.date));
      dayProjs.forEach(proj=>{
        const color=catColor(proj.cat);
        const isStart=ds===proj.date;
        if(isStart){
          // 시작날 — 짧은 바 + 텍스트 (할일/루틴 스타일)
          projHtml+=`<div class="day-item-row">
            <div class="day-item-bar" style="background:${color}"></div>
            <span class="day-item-label" style="color:var(--text);font-weight:600">${proj.title}</span>
          </div>`;
        } else {
          // 이어지는날 — 얇은 가로 바만
          projHtml+=`<div class="proj-cont-bar" style="background:${color}"></div>`;
        }
      });

      // 2) 할 일 (done 제외)
      const taskEvs=eventsOnDate(ds).filter(e=>e.type==='task'&&!e.done);
      let tasksHtml='';
      taskEvs.slice(0,2).forEach(e=>{
        tasksHtml+=`<div class="day-item-row">
          <div class="day-item-bar" style="background:${catColor(e.cat)}"></div>
          <span class="day-item-label">${e.title}</span>
        </div>`;
      });

      // 3) 루틴 (맨 아래, done 제외)
      const routineEvs=eventsOnDate(ds).filter(e=>e.type==='routine'&&!e.done);
      let routinesHtml='';
      routineEvs.slice(0,1).forEach(e=>{
        routinesHtml+=`<div class="day-item-row">
          <div class="day-item-bar" style="background:var(--pri-routine)"></div>
          <span class="day-item-label" style="opacity:.8">${e.title}</span>
        </div>`;
      });

      const overflow=(taskEvs.length>2?taskEvs.length-2:0)+(routineEvs.length>1?routineEvs.length-1:0);

      cellsHtml+=`<div class="${cls}" onclick="openDayPopup('${ds}')">
        <div class="day-num">${d}</div>
        <div class="proj-in-cell">${projHtml}</div>
        <div class="day-tasks">
          ${tasksHtml}
          ${routinesHtml}
          ${overflow>0?`<div class="more-count">+${overflow}개</div>`:''}
        </div>
      </div>`;
    });

    html+=`<div class="week-row">${cellsHtml}</div>`;
  }

  html+='</div>';
  area.innerHTML=html;
}

function prevMonth(){currentMonth--;if(currentMonth<0){currentMonth=11;currentYear--;}renderAll();}
function nextMonth(){currentMonth++;if(currentMonth>11){currentMonth=0;currentYear++;}renderAll();}

/* ══════════════ YEAR VIEW ══════════════ */
function renderYear(){
  const area=document.getElementById('cal-area');
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  let html=`<div class="cal-header">
    <button class="nav-btn" onclick="prevYear()">‹</button>
    <div class="cal-month-title" style="font-size:1.5rem">${currentYear}<span class="year" style="font-size:.82rem;margin-left:8px">연간 보기</span></div>
    <button class="nav-btn" onclick="nextYear()">›</button>
  </div><div class="year-grid">`;
  for(let m=0;m<12;m++){
    const isCur=m===today.getMonth()&&currentYear===today.getFullYear();
    html+=`<div class="year-month-card ${isCur?'current-month':''}" onclick="switchToMonth(${m})"><div class="year-month-name">${MN[m]}</div><div class="year-mini-grid">`;
    ['S','M','T','W','T','F','S'].forEach(h=>html+=`<div class="ymg-head">${h}</div>`);
    const first=new Date(currentYear,m,1).getDay(),days=new Date(currentYear,m+1,0).getDate();
    for(let i=0;i<first;i++)html+=`<div class="ymg-day"></div>`;
    for(let d=1;d<=days;d++){const ds=currentYear+'-'+pad(m+1)+'-'+pad(d);const isT=d===today.getDate()&&m===today.getMonth()&&currentYear===today.getFullYear();html+=`<div class="ymg-day ${isT?'today':''} ${eventsOnDate(ds).length?'has-ev':''}">${d}</div>`;}
    html+=`</div></div>`;
  }
  area.innerHTML=html+'</div>';
}
function switchToMonth(m){currentMonth=m;setView('month');}
function prevYear(){currentYear--;renderYear();}
function nextYear(){currentYear++;renderYear();}
function setView(v){view=v;document.getElementById('vbtn-month').classList.toggle('active',v==='month');document.getElementById('vbtn-year').classList.toggle('active',v==='year');if(v==='month')renderMonth();else renderYear();}
function goToday(){const n=new Date();currentYear=n.getFullYear();currentMonth=n.getMonth();if(view==='year')setView('month');else renderAll();}

/* ══════════════ DAY POPUP ══════════════ */
function openDayPopup(ds){
  dayPopupDate=ds;
  const d=parseDate(ds);const WD=['일','월','화','수','목','금','토'];
  document.getElementById('popup-date').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
  renderPopup(ds);
  document.getElementById('day-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('quick-input').focus(),150);
}
function renderPopup(ds){
  const evs=eventsOnDate(ds);
  const tasks=evs.filter(e=>e.type==='task');
  const projs=evs.filter(e=>e.type==='project');
  const routines=evs.filter(e=>e.type==='routine');
  let html='';
  if(tasks.length){html+=`<div class="popup-section-title">할 일</div>`;tasks.forEach(e=>html+=popupRow(e,ds));}
  if(projs.length){
    html+=`<div class="popup-section-title">프로젝트</div>`;
    projs.forEach(e=>{const end=parseDate(e.date2);const diff=end?Math.ceil((end-today)/86400000):null;html+=popupRow(e,ds,diff!==null?(diff>=0?`D-${diff}`:'마감'):'');});
  }
  if(routines.length){html+=`<div class="popup-section-title">루틴</div>`;routines.forEach(e=>html+=popupRoutineRow(e,ds));}
  if(!tasks.length&&!projs.length&&!routines.length)html='<div class="empty">일정 없음. 아래서 빠르게 추가!</div>';
  document.getElementById('popup-content').innerHTML=html;
}
function popupRow(e,ds,badge=''){
  return `<div class="popup-task-row">
    <div class="task-check ${e.done?'done':''}" onclick="toggleTaskAndRefresh('${e.id}','${ds}')"></div>
    <span class="popup-task-label ${e.done?'done':''}" onclick="toggleTaskAndRefresh('${e.id}','${ds}')">${e.title}</span>
    <span class="cat-badge ${catBgCls(e.cat)}">${catLabel(e.cat)}</span>
    ${badge?`<span style="font-size:.56rem;color:var(--text3);font-family:'Space Mono',monospace;flex-shrink:0">${badge}</span>`:''}
    <button class="popup-action-btn" onclick="openEditModal('${e.id}')" title="수정">✏️</button>
    <button class="popup-action-btn danger" onclick="deleteEventPopup('${e.id}','${ds}')" title="삭제">🗑</button>
  </div>`;
}
function popupRoutineRow(e,ds){
  const isDone=!!(e.dailyDone&&e.dailyDone[ds]);
  return `<div class="popup-task-row">
    <div class="task-check ${isDone?'done':''}" onclick="toggleRoutineDay('${e.id}','${ds}')"></div>
    <span class="popup-task-label ${isDone?'done':''}" onclick="toggleRoutineDay('${e.id}','${ds}')">${e.title}<span class="routine-tag">루틴</span></span>
    <span class="cat-badge ${catBgCls(e.cat)}">${catLabel(e.cat)}</span>
    <button class="popup-action-btn" onclick="openEditModal('${e.id}')" title="수정">✏️</button>
    <button class="popup-action-btn danger" onclick="deleteEventPopup('${e.id}','${ds}')" title="삭제">🗑</button>
  </div>`;
}
function toggleTaskAndRefresh(id,ds){toggleDone(id);renderPopup(ds);}
function toggleRoutineDay(id,ds){
  const e=events.find(x=>x.id===id);if(!e)return;
  if(!e.dailyDone)e.dailyDone={};
  e.dailyDone[ds]=!e.dailyDone[ds];
  save();renderPopup(ds);renderAll();
}
function deleteEventPopup(id,ds){
  const e=events.find(x=>x.id===id);
  if(e&&e.type==='routine'){
    e.endDate=ds;
  } else if(e&&e.type==='project'){
    if(e.date>=ds) events=events.filter(x=>x.id!==id);
    else e.date2=ds;
  } else {
    events=events.filter(x=>x.id!==id);
  }
  save();renderPopup(ds);
}
function quickAdd(){
  const inp=document.getElementById('quick-input');const title=inp.value.trim();if(!title)return;
  events.push({id:Date.now().toString(),type:'task',title,date:dayPopupDate,cat:'personal',priority:'normal',done:false,note:'',dailyDone:{}});
  save();inp.value='';renderPopup(dayPopupDate);renderAll();
}

/* ══════════════ ADD/EDIT MODAL ══════════════ */
function openAddModal(prefillDate){
  editingId=null;currentType='task';
  document.getElementById('modal-title').textContent='새 일정';
  ['f-title','f-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-cat').value='personal';
  document.getElementById('f-pri').value='normal';
  const ds=prefillDate||selectedDate||todayStr();
  document.getElementById('f-date1').value=ds;
  document.getElementById('f-date2').value=ds;
  selectType('task');
  document.getElementById('add-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),150);
}
function openEditModal(id){
  const e=events.find(x=>x.id===id);if(!e)return;
  editingId=id;
  document.getElementById('modal-title').textContent='일정 수정';
  document.getElementById('f-title').value=e.title;
  document.getElementById('f-note').value=e.note||'';
  document.getElementById('f-cat').value=e.cat||'personal';
  document.getElementById('f-pri').value=(e.priority==='routine'?'normal':e.priority)||'normal';
  document.getElementById('f-date1').value=e.date||todayStr();
  document.getElementById('f-date2').value=e.date2||e.date||todayStr();
  selectType(e.type);
  closeModal('day-overlay');
  document.getElementById('add-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),150);
}
function selectType(t){
  currentType=t;
  ['task','project','routine'].forEach(x=>document.getElementById('type-'+x).classList.toggle('selected',x===t));
  const isProj=t==='project',isRoutine=t==='routine';
  document.getElementById('date2-wrap').style.display=isProj?'block':'none';
  document.getElementById('date-label1').textContent=isProj?'시작일':'날짜';
  document.getElementById('date-row').style.display=isRoutine?'none':'grid';
  document.getElementById('pri-wrap').style.display=isRoutine?'none':'block';
}
function saveEvent(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){document.getElementById('f-title').focus();return;}
  const isRoutine=currentType==='routine';
  const existing=editingId?events.find(x=>x.id===editingId):null;
  const e={
    id:editingId||Date.now().toString(),
    type:currentType,title,
    date:isRoutine?todayStr():document.getElementById('f-date1').value,
    date2:currentType==='project'?document.getElementById('f-date2').value:null,
    cat:document.getElementById('f-cat').value,
    priority:isRoutine?'routine':document.getElementById('f-pri').value,
    done:existing?existing.done:false,
    note:document.getElementById('f-note').value||'',
    dailyDone:isRoutine?(existing&&existing.dailyDone?existing.dailyDone:{}):{},
  };
  // null/undefined 제거 (Firebase는 undefined 거부)
  Object.keys(e).forEach(k=>{if(e[k]===undefined||e[k]===null)delete e[k];});
  if(editingId)events=events.map(x=>x.id===editingId?e:x);
  else events.push(e);
  closeModal('add-overlay');
  save();renderAll();
}
function toggleDone(id){
  const e=events.find(x=>x.id===id);
  if(e){e.done=!e.done;save();renderAll();}
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function closeOverlay(ev,id){if(ev.target.id===id)closeModal(id);}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('add-overlay');closeModal('day-overlay');hideCtxMenu();endReorder();}});

/* ══════════════ SWIPE SIDEBAR (모바일) ══════════════ */
function openSidebar(){
  document.querySelector('aside').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
  document.getElementById('swipe-hint').style.opacity='0';
}
function closeSidebar(){
  document.querySelector('aside').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
  document.getElementById('swipe-hint').style.opacity='.5';
}

// 터치 스와이프 감지
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=Math.abs(e.changedTouches[0].clientY-touchStartY);
  // 오른쪽으로 50px 이상 스와이프 & 세로 이동 적으면 열기
  if(dx>50&&dy<60&&touchStartX<40) openSidebar();
  // 왼쪽으로 50px 이상 스와이프면 닫기
  if(dx<-50&&dy<60) closeSidebar();
},{passive:true});

init();
</script>
